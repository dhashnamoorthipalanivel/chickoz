<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381 585" width="381" height="585">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#141e30"/><stop offset="100%" style="stop-color:#243b55"/></linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7BBF3F"/><stop offset="100%" style="stop-color:#2E8B74"/></linearGradient>
  </defs>
  <rect width="381" height="585" fill="url(#bg)"/>
  <!-- Stack body -->
  <rect x="110" y="100" width="160" height="250" rx="8" fill="rgba(255,255,255,0.04)" stroke="url(#acc)" stroke-width="3"/>
  <!-- Stack layers -->
  <rect x="116" y="116" width="148" height="22" rx="3" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <rect x="116" y="144" width="148" height="22" rx="3" fill="rgba(46,139,116,0.25)" stroke="url(#acc)" stroke-width="1"/>
  <rect x="116" y="172" width="148" height="22" rx="3" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <rect x="116" y="200" width="148" height="22" rx="3" fill="rgba(46,139,116,0.25)" stroke="url(#acc)" stroke-width="1"/>
  <rect x="116" y="228" width="148" height="22" rx="3" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <rect x="116" y="256" width="148" height="22" rx="3" fill="rgba(46,139,116,0.25)" stroke="url(#acc)" stroke-width="1"/>
  <rect x="116" y="284" width="148" height="22" rx="3" fill="rgba(123,191,63,0.3)" stroke="url(#acc)" stroke-width="1"/>
  <!-- End plates -->
  <rect x="104" y="92" width="172" height="14" rx="4" fill="url(#acc)" opacity="0.7"/>
  <rect x="104" y="348" width="172" height="14" rx="4" fill="url(#acc)" opacity="0.7"/>
  <!-- Bolts -->
  <circle cx="120" cy="99" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="260" cy="99" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="120" cy="355" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="260" cy="355" r="5" fill="rgba(255,255,255,0.3)"/>
  <!-- H2 output -->
  <line x1="190" y1="92" x2="190" y2="60" stroke="url(#acc)" stroke-width="2.5"/>
  <rect x="165" y="44" width="50" height="22" rx="6" fill="url(#acc)" opacity="0.8"/>
  <text x="190" y="59" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">H₂ Out</text>
  <!-- Water input -->
  <line x1="130" y1="362" x2="130" y2="400" stroke="#29ABE2" stroke-width="2.5"/>
  <rect x="100" y="400" width="60" height="22" rx="6" fill="#29ABE2" opacity="0.7"/>
  <text x="130" y="415" text-anchor="middle" font-family="Arial" font-size="12" fill="white">H₂O In</text>
  <!-- O2 output -->
  <line x1="250" y1="362" x2="250" y2="400" stroke="url(#acc)" stroke-width="2.5"/>
  <rect x="220" y="400" width="60" height="22" rx="6" fill="url(#acc)" opacity="0.6"/>
  <text x="250" y="415" text-anchor="middle" font-family="Arial" font-size="12" fill="white">O₂ Out</text>
  <!-- Labels -->
  <text x="144" y="132" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.6)">Anode</text>
  <text x="144" y="160" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.6)">Membrane</text>
  <text x="144" y="188" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.6)">Cathode</text>
  <text x="190" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">Electrolyser Systems</text>
  <text x="190" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="rgba(123,191,63,0.9)">PEM · AEM · Stacks · Water Splitting</text>
</svg>